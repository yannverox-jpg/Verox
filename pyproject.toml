[project]
name = "verox-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "vercel-queue==0.10.0",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[[tool.vercel.subscribers]]
entrypoint = "verox_queue_worker:process_agent_task"

[[tool.vercel.subscribers]]
entrypoint = "verox_browser_queue_worker:process_browser_job"
