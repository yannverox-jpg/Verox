name: Verox cognition foundation tests

on:
  push:
    branches:
      - feat/live-cognition-foundation
      - integration/cognitive-architecture
  pull_request:
    paths:
      - "core/cognition/**"
      - "main.py"
      - "nexus_dashboard.html"
      - "tests/test_read_only_operations.py"
      - "tests/test_operational_route_contract.py"
      - "tests/test_cognition_foundation.py"
      - "tests/test_gateway_worker.py"
      - "tests/test_memory_persistence.py"
      - "tests/test_channels_treasury.py"
      - "tests/test_agent_dispatch.py"
      - "tests/test_write_policy.py"
      - "verox_brain/**"
      - "supabase/migrations/*verox_experience_library.sql"
      - ".github/workflows/verox-cognition-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install "httpx>=0.27.0"
      - name: Run cognition foundation tests
        run: python -m py_compile main.py core/cognition/read_only_operations.py && python -m unittest tests.test_cognition_foundation tests.test_gateway_worker tests.test_memory_persistence tests.test_channels_treasury tests.test_read_only_operations tests.test_operational_route_contract tests.test_agent_dispatch tests.test_write_policy -v
