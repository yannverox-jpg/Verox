name: Cognitive provider tests

on:
  push:
    branches: ["feat/cognitive-provider-bridge"]
  pull_request:
    branches: ["main"]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip httpx
      - run: python -m py_compile main.py cognitive_providers.py scripts/model_bridge.py scripts/probe_readonly_tools.py
      - run: python -m unittest discover -s tests -v
