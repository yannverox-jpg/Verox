name: Verify Verox Vercel API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, vercel-safe-cleanup]

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "fastapi>=0.115.0" "httpx>=0.27.0" "psycopg[binary]>=3.2.9" "ai[vercel]>=0.9.0"
      - name: Run API contract tests
        run: python -m unittest discover -s tests -p "test_vercel_api.py" -v
