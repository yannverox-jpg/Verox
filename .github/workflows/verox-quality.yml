name: Verox quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install "httpx==0.28.1" "vercel-queue==0.10.0"
      - name: Compile Python modules
        run: python -m compileall -q api verox_brain verox_queue_worker.py tests
      - name: Run opportunity engine tests
        run: python -m unittest tests.test_opportunity_engine
