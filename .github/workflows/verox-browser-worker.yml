name: Verox read-only browser worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: verox-browser-worker
  cancel-in-progress: false

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - name: Check required server-side secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "::error::Configure repository Actions secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY before running the worker."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL must use HTTPS."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install isolated Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Run browser worker policy tests
        run: python -m unittest discover -s tests -p "test_browser_worker.py" -v

      - name: Build static reverse-engineering inventory
        run: python -m verox_brain.recon --json > "$RUNNER_TEMP/verox-recon.json"

      - name: Diagnose core runtime and retry bounded checks
        run: python -m verox_brain.self_repair --json --propose-repairs > "$RUNNER_TEMP/verox-self-repair.json"

      - name: Preserve sanitized reconnaissance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verox-recon-${{ github.run_id }}
          path: ${{ runner.temp }}/verox-recon.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve self-diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verox-self-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/verox-self-repair.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Process a bounded batch of read-only jobs
        run: python -m verox_brain.browser_worker --cycle
