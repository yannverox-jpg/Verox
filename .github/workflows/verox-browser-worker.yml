name: Verox read-only browser worker

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: verox-browser-worker
  cancel-in-progress: false

jobs:
  trigger-render-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate trigger secret
        env:
          RENDER_WORKER_TOKEN: ${{ secrets.VEROX_RENDER_WORKER_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$RENDER_WORKER_TOKEN" || ${#RENDER_WORKER_TOKEN} -lt 32 ]]; then
            echo "::error::Configure VEROX_RENDER_WORKER_TOKEN (at least 32 characters) in GitHub Actions and Render."
            exit 1
          fi
      - name: Trigger bounded read-only research cycle on Render
        env:
          RENDER_WORKER_TOKEN: ${{ secrets.VEROX_RENDER_WORKER_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $RENDER_WORKER_TOKEN" \
            --header "Content-Length: 0" \
            "https://verox-juqt.onrender.com/api/internal/read-only-research/run"
