name: Financial ledger regression tests

on:
  push:
    branches: [main, "fix/financial-ledger-safety-tests"]
    paths:
      - "sandbox/financial_ledger.py"
      - "tests/test_financial_ledger.py"
      - ".github/workflows/financial-ledger-tests.yml"
  pull_request:
    paths:
      - "sandbox/financial_ledger.py"
      - "tests/test_financial_ledger.py"
      - ".github/workflows/financial-ledger-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run financial ledger regression tests
        run: python -m unittest discover -s tests -v
