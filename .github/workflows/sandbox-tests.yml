name: Verox Sandbox tests

on:
  push:
    branches:
      - main
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-tests.yml"
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-tests.yml"

permissions:
  contents: read

jobs:
  sandbox-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline Sandbox unit tests
        run: python -m unittest sandbox.test_engine sandbox.test_backtesting sandbox.test_history_db sandbox.test_ingestion sandbox.test_orchestrator sandbox.test_resilience_protocol sandbox.test_autonomous_boot sandbox.test_real_world_modules -v
