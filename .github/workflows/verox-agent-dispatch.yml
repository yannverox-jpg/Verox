name: Verox agent dispatch checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/verox-agent-dispatch]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime and routing module
        run: python -m py_compile main.py verox_brain/dispatch.py
      - name: Run agent dispatch unit tests
        run: python -m unittest discover -s tests -p 'test_agent_dispatch.py' -v
