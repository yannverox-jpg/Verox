name: Verox autonomous brain tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/osint-source-registry]

permissions:
  contents: read

concurrency:
  group: verox-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-plane-and-browser-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile API and worker modules
        run: python -m py_compile api/index.py api/browser_jobs.py api/research.py verox_brain/data_plane.py verox_brain/browser_worker.py verox_brain/model_client.py verox_brain/behavioral_analysis.py

      - name: Test durable data-plane sanitization and hashing
        run: python -m unittest discover -s tests -p "test_data_plane.py" -v

      - name: Test read-only browser policy boundaries
        run: python -m unittest discover -s tests -p "test_browser_worker.py" -v

      - name: Test behavioral analysis and historical validation primitives
        run: python -m unittest discover -s tests -p "test_behavioral_analysis.py" -v
