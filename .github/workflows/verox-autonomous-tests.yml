name: Verox autonomous brain tests

on:
  pull_request:
    branches: [main, feat/osint-source-registry]
  push:
    branches: [feat/osint-source-registry, feat/brain-self-repair-loop]

permissions:
  contents: read

concurrency:
  group: verox-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-plane-and-browser-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile API and worker modules
        run: python -m py_compile api/index.py api/browser_jobs.py api/research.py verox_brain/data_plane.py verox_brain/browser_worker.py verox_brain/model_client.py verox_brain/behavioral_analysis.py verox_brain/research_pipeline.py verox_brain/self_repair.py verox_brain/recon.py verox_brain/causal_lab.py verox_brain/repair_sandbox.py verox_brain/platform_probe.py

      - name: Test durable data-plane sanitization and hashing
        run: python -m unittest discover -s tests -p "test_data_plane.py" -v

      - name: Test read-only browser policy boundaries
        run: python -m unittest discover -s tests -p "test_browser_worker.py" -v

      - name: Test behavioral analysis and historical validation primitives
        run: python -m unittest discover -s tests -p "test_behavioral_analysis.py" -v

      - name: Test evidence-first research pipeline
        run: python -m unittest discover -s tests -p "test_research_pipeline.py" -v

      - name: Test bounded self-diagnostic and recovery loop
        run: python -m unittest discover -s tests -p "test_self_repair.py" -v

      - name: Test causal analysis and revenue evidence grading
        run: python -m unittest discover -s tests -p "test_causal_lab.py" -v

      - name: Test isolated repair sandbox boundaries
        run: python -m unittest discover -s tests -p "test_repair_sandbox.py" -v

      - name: Test public platform structural profiling
        run: python -m unittest discover -s tests -p "test_platform_probe.py" -v


      - name: Test model-driven repair proposal boundaries
        run: python -m unittest discover -s tests -p "test_repair_agent.py" -v

      - name: Test platform revenue strategy engine
        run: python -m unittest discover -s tests -p "test_platform_strategy.py" -v
