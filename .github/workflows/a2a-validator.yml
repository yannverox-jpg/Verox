name: Verox A2A validator

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a2a-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install "pydantic>=2.7,<3" "pytest>=8.0,<9"
      - name: Run A2A governance tests
        run: python -m pytest -q tests/test_verox_a2a_validator.py tests/test_verox_a2a_runtime_guard.py
