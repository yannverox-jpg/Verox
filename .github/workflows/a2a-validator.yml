name: Verox A2A validator

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a2a-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install "pydantic>=2.7,<3" "pytest>=8.0,<9" "httpx>=0.27,<1"
      - name: Audit financial side-effect call sites
        run: python scripts/audit_financial_bypass.py
      - name: Run A2A governance tests
        run: python -m pytest -q tests/test_audit_financial_bypass.py tests/test_t1_to_t6_financial_guardrails.py tests/test_data_plane_rpc.py tests/test_financial_execution_guard.py tests/test_financial_approval_supabase_adapter.py tests/test_verox_a2a_validator.py tests/test_verox_a2a_runtime_guard.py tests/test_runtime_guardrails.py

  local-postgres-t3-t5:
    # Keep the ephemeral database job scoped to its dedicated validation PR.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/local-postgres-t3-t5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test driver
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<9"
      - name: Create Supabase-compatible roles for migration grants
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS"
      - name: Bootstrap empty local database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Apply financial authorization migrations only
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122201142_financial_authorization_t6.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122201315_bind_financial_authorization_operation_context.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122203246_persist_financial_authorization_expiration.sql
      - name: Run T3/T5 against ephemeral PostgreSQL
        run: python -m pytest -q tests/test_financial_guardrails_local_postgres.py
