name: Isolated financial REST and A2A integration

on:
  pull_request:
    paths:
      - "supabase/schema.sql"
      - "supabase/migrations/**"
      - "verox_brain/runtime_guardrails.py"
      - "verox_brain/a2a_adapters.py"
      - "verox_queue_worker.py"
      - "api/index.py"
      - "verox_a2a_runtime_guard.py"
      - "tests/test_financial_authorization_rest_integration.py"
      - "tests/test_verox_a2a_runtime_guard.py"
      - "tests/test_worker_runtime_guardrails.py"
      - ".github/workflows/financial-authorization-rest-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-rest-and-a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verox_test
      POSTGREST_URL: http://127.0.0.1:3000
      PGRST_JWT_SECRET: isolated-ci-secret-not-for-any-environment-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4" "pytest>=8,<9"
      - name: Create Supabase-compatible roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE ROLE authenticator LOGIN NOINHERIT PASSWORD 'postgres';
          GRANT anon, authenticated, service_role TO authenticator;
          GRANT CONNECT ON DATABASE verox_test TO authenticator;
          SQL
      - name: Bootstrap isolated database and financial authorization migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122201142_financial_authorization_t6.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122201315_bind_financial_authorization_operation_context.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122203246_persist_financial_authorization_expiration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123070830_restrict_financial_authorization_delete_truncate.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123071320_revoke_financial_authorization_direct_updates.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123133911_require_authenticated_human_financial_approval.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123133924_otp_owner_financial_approval_rpc.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123133936_distributed_otp_rate_limit.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123133947_enable_otp_rate_limit_rls.sql
      - name: Start PostgREST against ephemeral PostgreSQL only
        run: |
          docker run -d --rm --network host --name verox-postgrest-ci \
            -e PGRST_DB_URI="postgres://authenticator:postgres@127.0.0.1:5432/verox_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_DB_EXTRA_SEARCH_PATH=public,private \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H "Accept: application/openapi+json" "$POSTGREST_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs verox-postgrest-ci
          exit 1
      - name: Test REST roles, OTP lockout, persisted approval, expiration, and concurrent consumption
        run: python -m pytest -q tests/test_financial_authorization_rest_integration.py
      - name: Test invalid A2A evidence and fail-closed worker/fallback routing
        run: python -m pytest -q tests/test_verox_a2a_runtime_guard.py tests/test_worker_runtime_guardrails.py
