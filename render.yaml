services:
  - type: web
    name: verox
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium firefox
    startCommand: python main.py --server
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COGNITIVE_PROXY_URL
        sync: false
      - key: COGNITIVE_GEO_TARGET
        value: Zurich-CH / Frankfurt-DE
      - key: USER_EMAIL
        sync: false
